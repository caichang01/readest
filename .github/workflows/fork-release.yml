name: Fork Release Installers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current app version even if it did not change
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: apps/readest-app
  NDK_VERSION: 28.2.13676358
  TAURI_PORTABLE_APPIMAGE_REV: 503bdbc1eade37d50a64ea7f81dbe853338b7fda
  QUICK_SHARUN_REV: b3a9e985cdedf7efa81d172f182cd13983743147
  QUICK_SHARUN_SHA256: 4b765d0b38621852f5fc6cbf460641fcce6103b548582d58942abc65ab7dbd93

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Test fork release helpers
        run: node --test .github/scripts/*.test.mjs

      - name: Detect version change
        id: release
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
        run: node .github/scripts/release-metadata.mjs

  android:
    name: Android release APKs
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;35.0.0"
          "ndk;${NDK_VERSION}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-android
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Prepare self-hosted Tauri environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_UPDATER_BASE_URL: ${{ vars.NEXT_PUBLIC_UPDATER_BASE_URL }}
          NEXT_PUBLIC_UPDATER_PUBKEY: ${{ vars.NEXT_PUBLIC_UPDATER_PUBKEY }}
        run: node .github/scripts/prepare-fork-env.mjs "$APP_DIR/.env.tauri" "$APP_DIR/.env.local"

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git restore src-tauri/gen/android src-tauri/icons

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/readest-fork.jks"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            alias="$KEY_ALIAS"
            password="$KEY_PASSWORD"
            echo "Using the stable Android signing key configured in repository secrets."
          else
            alias="readest-fork-ci"
            password="android"
            echo "::warning::ANDROID_KEY_* secrets are not configured. This run uses a temporary signing key; its APKs cannot update APKs from another run."
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass "$password" \
              -keypass "$password" \
              -alias "$alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Readest Fork CI,OU=CI,O=Readest Fork,L=Unknown,ST=Unknown,C=US"
          fi

          cat > "$APP_DIR/src-tauri/gen/android/keystore.properties" <<EOF
          keyAlias=$alias
          password=$password
          storeFile=$keystore
          EOF

      - name: Build universal and ARM64 APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA::8}"
          out="$GITHUB_WORKSPACE/dist/android"
          mkdir -p "$out"

          pnpm tauri android build
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$out/Readest_${version}_${short_sha}_universal.apk"

          pnpm tauri android build --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$out/Readest_${version}_${short_sha}_arm64.apk"

      - name: Verify Android APKs
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for apk in dist/android/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk" >/dev/null
            (
              cd "$APP_DIR"
              pnpm tauri signer sign "$GITHUB_WORKSPACE/$apk"
            )
            test -s "$apk.sig"
          done
          sha256sum dist/android/*.apk dist/android/*.apk.sig > dist/android/SHA256SUMS

      - name: Upload Android installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-android-${{ github.sha }}
          path: dist/android
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: ${{ matrix.name }} release installer
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            runs_on: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
            artifact_name: readest-windows-x64
          - name: Windows ARM64
            platform: windows
            runs_on: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            tauri_args: --target aarch64-pc-windows-msvc --bundles nsis
            artifact_name: readest-windows-arm64
          - name: Linux x64
            platform: linux
            runs_on: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: ""
            artifact_name: readest-linux-x64
          - name: Linux ARM64
            platform: linux
            runs_on: ubuntu-22.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            tauri_args: ""
            artifact_name: readest-linux-arm64
          - name: macOS Universal
            platform: macos
            runs_on: macos-latest
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            tauri_args: --target universal-apple-darwin
            artifact_name: readest-macos-universal
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-${{ matrix.artifact_name }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install pinned portable AppImage bundler
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/tauri-portable-appimage"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/tauri-apps/tauri
          git -C "$source_dir" fetch --depth 1 origin "$TAURI_PORTABLE_APPIMAGE_REV"
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = "$TAURI_PORTABLE_APPIMAGE_REV"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          git -C "$source_dir" apply \
            "$GITHUB_WORKSPACE/.github/patches/tauri-portable-appimage.patch"
          cargo install tauri-cli \
            --path "$source_dir/crates/tauri-cli" \
            --locked \
            --force

      - name: Pin AppImage helper
        if: matrix.platform == 'linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          helper="$cache_dir/quick-sharun.sh"
          mkdir -p "$cache_dir"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "$helper" \
            "https://api.github.com/repos/pkgforge-dev/Anylinux-AppImages/contents/useful-tools/quick-sharun.sh?ref=${QUICK_SHARUN_REV}"
          printf '%s  %s\n' "$QUICK_SHARUN_SHA256" "$helper" | sha256sum --check
          chmod +x "$helper"

      - name: Prepare self-hosted Tauri environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_UPDATER_BASE_URL: ${{ vars.NEXT_PUBLIC_UPDATER_BASE_URL }}
          NEXT_PUBLIC_UPDATER_PUBKEY: ${{ vars.NEXT_PUBLIC_UPDATER_PUBKEY }}
        run: >-
          node .github/scripts/prepare-fork-env.mjs
          "$APP_DIR/.env.tauri"
          "$APP_DIR/.env.local"
          "$APP_DIR/src-tauri/fork-ci-tauri-config.generated.json"

      - name: Build release installer
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            timeout --signal=TERM --kill-after=30s 50m cargo tauri build \
              --config src-tauri/fork-ci-tauri-config.generated.json
          else
            pnpm tauri build --config src-tauri/fork-ci-tauri-config.generated.json ${{ matrix.tauri_args }}
          fi

      - name: Collect release installer
        run: |
          set -euo pipefail
          out="dist/${{ matrix.artifact_name }}"
          mkdir -p "$out"

          case "${{ matrix.platform }}" in
            windows)
              find target -type f \
                \( -path '*/bundle/nsis/*-setup.exe' -o -path '*/bundle/nsis/*-setup.exe.sig' \) \
                -exec cp {} "$out/" \;
              ;;
            macos)
              find target -type f -path '*/bundle/dmg/*.dmg' -exec cp {} "$out/" \;
              find target -type f \
                \( -path '*/bundle/macos/*.app.tar.gz' -o -path '*/bundle/macos/*.app.tar.gz.sig' \) \
                -exec cp {} "$out/" \;
              ;;
            linux)
              find target -type f \
                \( -path '*/bundle/appimage/*.AppImage' \
                -o -path '*/bundle/appimage/*.AppImage.sig' \
                -o -path '*/bundle/deb/*.deb' \) \
                -exec cp {} "$out/" \;
              ;;
          esac

          test -n "$(find "$out" -type f -print -quit)"
          if [ "${{ matrix.platform }}" != "macos" ]; then
            test -n "$(find "$out" -type f -name '*.sig' -print -quit)"
          else
            test "$(find "$out" -type f -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" -eq 1
          fi

      - name: Upload release installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: needs.metadata.outputs.should_release == 'true'
    needs: [metadata, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: readest-*-${{ github.sha }}
          path: release-artifacts

      - name: Stage and verify release assets
        run: |
          set -euo pipefail
          mkdir -p release-files

          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ "$name" = "SHA256SUMS" ]; then
              continue
            fi
            if [ -e "release-files/$name" ]; then
              echo "::error::Duplicate release asset name: $name"
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find release-artifacts -type f -print0)

          test "$(find release-files -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-files -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-files -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-files -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-files -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-files -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-files -maxdepth 1 -type f -name '*.sig' | wc -l | tr -d ' ')" -eq 7

          cp apps/readest-app/release-notes.json release-files/release-notes.json

      - name: Generate signed updater manifest
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_NOTES: Readest fork v${{ needs.metadata.outputs.version }}
        run: node .github/scripts/updater-manifest.mjs release-files release-files/latest.json

      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd release-files
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Inspect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject an unrelated existing tag
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists without a GitHub Release. Refusing to overwrite it."
            exit 1
          fi

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          release_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "Readest v$RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"

      - name: Repair and publish an interrupted draft release
        if: steps.existing.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" release-files/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Report an already published release
        if: steps.existing.outputs.exists == 'true' && steps.existing.outputs.is_draft == 'false'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: echo "Release $RELEASE_TAG already exists; no duplicate was created."
