name: readest-fork

services:
  readest:
    image: ${READEST_IMAGE}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${READEST_HTTP_PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_ADMIN_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      API_BASE_URL: ${API_BASE_URL}
      OBJECT_STORAGE_TYPE: ${OBJECT_STORAGE_TYPE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TEMP_STORAGE_PUBLIC_BUCKET_NAME: ${TEMP_STORAGE_PUBLIC_BUCKET_NAME:-}
      STORAGE_LIMIT_BYTES: ${STORAGE_LIMIT_BYTES:-0}
      TRANSLATION_DAILY_LIMIT: ${TRANSLATION_DAILY_LIMIT:-0}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/runtime-config.js').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
